<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pimp Wyld C Mirror</title><style>html,body{margin:0;background:#050609;color:#eee;font-family:Consolas,monospace}.bar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:10px 14px;background:#10131b;border-bottom:1px solid #303849;color:#45e9e9;font-size:12px}.bar button{margin-left:auto;background:#ff3a74;border:0;padding:9px 12px;font:bold 12px Consolas;cursor:pointer}.hint{color:#9da5b6}.terminal{min-height:720px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(10px,1.5vw,15px);line-height:1.2;color:#edf0f5}.terminal .red{color:#ff4668}.terminal .green{color:#52f46b}.terminal .yellow{color:#ffe45c}.terminal .cyan{color:#4be9ed}@media(max-width:650px){.terminal{min-height:600px;padding:8px;font-size:9px}.hint{display:none}}</style></head><body><div class="bar"><b>ACTUAL C GAME</b><span class="hint">Input opens as a browser prompt so the same C command loop works on phone and desktop.</span><button onclick="location.reload()">RESTART</button></div><pre id="terminal" class="terminal">Loading the original C game…</pre><script>window.PimpTerminal={el:document.getElementById('terminal'),buffer:'',write(t){this.buffer+=t;this.buffer=this.buffer.replace(/\x1b\[2J\x1b\[H/g,'\f').split('\f').pop();this.buffer=this.buffer.replace(/\x1b\[[0-9;?]*[A-Za-z]/g,'');if(this.buffer.length>50000)this.buffer=this.buffer.slice(-50000);this.el.textContent=this.buffer;requestAnimationFrame(()=>scrollTo(0,document.body.scrollHeight))}};</script><script src="pimpwyld.js"></script></body></html>
