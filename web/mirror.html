<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pimp Wyld C Mirror</title>
<style>
html,body{margin:0;background:rgba(5,6,9,.9);color:#eee;font-family:Consolas,monospace;overflow-x:hidden}.bar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:9px;background:#10131be8;border-bottom:1px solid #303849;color:#45e9e9;font-size:12px}.bar button,.keybar button{background:#18202d;border:1px solid #3a465b;color:#fff;padding:9px;font:bold 12px Consolas;cursor:pointer}.bar button:first-of-type{margin-left:auto}.terminal{width:min(1180px,calc(100% - 20px));min-height:480px;margin:0 auto;padding:10px 10px 152px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(9px,1.4vw,14px);line-height:1.18}.input-dock{position:fixed;z-index:4;left:50%;width:min(1500px,100%);transform:translateX(-50%);bottom:0;background:#0d1119ee;border:1px solid #3a465b;padding:8px;backdrop-filter:blur(8px)}.prompt{color:#ffe45c;font-size:11px;min-height:15px;margin-bottom:6px}.entry{display:flex;gap:7px}.entry input{min-width:0;flex:1;background:#050609;border:1px solid #48e7ea;color:#fff;padding:11px;font:16px Consolas}.entry button{background:#ff3a74;border:0;font:bold 12px Consolas;padding:0 16px}.keybar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:7px}.keybar button{padding:8px 2px}.keybar .wide{grid-column:span 2;color:#ffe45c}@media(max-width:650px){.terminal{width:100%;min-height:420px;font-size:8px;padding:7px 7px 165px}.bar .hint{display:none}.keybar{grid-template-columns:repeat(7,1fr)}}
</style></head><body>
<div class="bar"><b>ACTUAL C GAME</b><span class="hint">Same game rules as Windows.</span><button id="fullBtn">FULLSCREEN</button><button onclick="location.reload()">RESTART</button></div>
<pre id="terminal" class="terminal">Loading the C game…</pre>
<div class="input-dock"><div id="prompt" class="prompt">Loading…</div><div class="entry"><input id="entry" inputmode="text" autocomplete="off" autocapitalize="characters" aria-label="Game command"><button id="send">ENTER</button></div><div id="keybar" class="keybar"></div></div>
<script>
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function xtermColor(n){const base=['#000000','#800000','#008000','#808000','#000080','#800080','#008080','#c0c0c0','#808080','#ff0000','#00ff00','#ffff00','#0000ff','#ff00ff','#00ffff','#ffffff'];if(n<16)return base[n];if(n<232){n-=16;const v=[0,95,135,175,215,255],r=v[Math.floor(n/36)],g=v[Math.floor(n%36/6)],b=v[n%6];return `rgb(${r},${g},${b})`}const c=8+(n-232)*10;return `rgb(${c},${c},${c})`}
function ansiHtml(raw){let out='',last=0,fg='',bg='',bold=false,open=false;const basicFg={30:0,31:1,32:2,33:3,34:4,35:5,36:6,37:7,90:8,91:9,92:10,93:11,94:12,95:13,96:14,97:15},basicBg={40:0,41:1,42:2,43:3,44:4,45:5,46:6,47:7,100:8,101:9,102:10,103:11,104:12,105:13,106:14,107:15},re=/\x1b\[([0-9;]*)m/g;function begin(){if(fg||bg||bold){out+=`<span style="${fg?'color:'+fg+';':''}${bg?'background-color:'+bg+';':''}${bold?'font-weight:700;':''}">`;open=true}}for(let m;(m=re.exec(raw));){out+=escapeHtml(raw.slice(last,m.index));if(open){out+='</span>';open=false}const codes=(m[1]||'0').split(';').map(Number);for(let i=0;i<codes.length;i++){const c=codes[i];if(c===0){fg='';bg='';bold=false}else if(c===1)bold=true;else if(c===22)bold=false;else if(c===39)fg='';else if(c===49)bg='';else if(basicFg[c]!==undefined)fg=xtermColor(basicFg[c]);else if(basicBg[c]!==undefined)bg=xtermColor(basicBg[c]);else if((c===38||c===48)&&codes[i+1]===5&&codes[i+2]!==undefined){if(c===38)fg=xtermColor(codes[i+2]);else bg=xtermColor(codes[i+2]);i+=2}else if((c===38||c===48)&&codes[i+1]===2&&codes[i+4]!==undefined){const rgb=`rgb(${codes[i+2]},${codes[i+3]},${codes[i+4]})`;if(c===38)fg=rgb;else bg=rgb;i+=4}}begin();last=re.lastIndex}out+=escapeHtml(raw.slice(last));if(open)out+='</span>';return out}
window.PimpTerminal={el:document.getElementById('terminal'),buffer:'',write(t){this.buffer+=t;this.buffer=this.buffer.replace(/\x1b\[2J\x1b\[H/g,'\f').split('\f').pop().replace(/\x1b\[[0-9;?]*[A-HJ-KSTf]/g,'');if(this.buffer.length>60000)this.buffer=this.buffer.slice(-60000);this.el.innerHTML=ansiHtml(this.buffer);requestAnimationFrame(()=>scrollTo(0,document.body.scrollHeight))}};
const entry=document.getElementById('entry'),promptEl=document.getElementById('prompt');let resolver=null,mode='key';
function finish(value){if(!resolver)return;const done=resolver;resolver=null;entry.value='';promptEl.textContent='Processing…';done(value)}
window.PimpInput={readKey(){mode='key';promptEl.textContent='Enter a command';entry.inputMode='text';entry.focus();return new Promise(r=>resolver=r)},readNumber(label){mode='number';promptEl.textContent=label;entry.inputMode='numeric';entry.focus();return new Promise(r=>resolver=r)}};
function submit(){let v=entry.value.trim();if(mode==='number')finish(Number.parseInt(v,10)||0);else finish((v||'\n').charCodeAt(0))}document.getElementById('send').onclick=submit;entry.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}else if(e.key==='Escape'){e.preventDefault();finish(27)}});
const keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['ESC','ENTER']);document.getElementById('keybar').innerHTML=keys.map(k=>`<button class="${k.length>1?'wide':''}" data-key="${k}">${k}</button>`).join('');document.getElementById('keybar').onclick=e=>{const k=e.target.dataset.key;if(!k)return;if(k==='ESC')finish(27);else if(k==='ENTER')finish(10);else finish(k.charCodeAt(0))};
document.getElementById('fullBtn').onclick=async()=>{try{if(window.parent!==window){const outer=window.parent.document.getElementById('gameStage');if(!window.parent.document.fullscreenElement)await outer.requestFullscreen();else await window.parent.document.exitFullscreen();return}if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{promptEl.textContent='Fullscreen is unavailable in this browser; rotate your phone for a larger view.'}};
</script><script src="engine.php?build=fb2d002"></script></body></html>
