<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pimp Wyld C Mirror</title>
<style>
html,body{margin:0;background:#050609;color:#eee;font-family:Consolas,monospace}.bar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:9px;background:#10131b;border-bottom:1px solid #303849;color:#45e9e9;font-size:12px}.bar button,.keybar button{background:#18202d;border:1px solid #3a465b;color:#fff;padding:9px;font:bold 12px Consolas;cursor:pointer}.bar button:first-of-type{margin-left:auto}.terminal{min-height:570px;padding:10px 10px 145px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(9px,1.4vw,14px);line-height:1.18}.input-dock{position:fixed;z-index:4;left:0;right:0;bottom:0;background:#0d1119ee;border-top:1px solid #3a465b;padding:8px;backdrop-filter:blur(8px)}.prompt{color:#ffe45c;font-size:11px;min-height:15px;margin-bottom:6px}.entry{display:flex;gap:7px}.entry input{min-width:0;flex:1;background:#050609;border:1px solid #48e7ea;color:#fff;padding:11px;font:16px Consolas}.entry button{background:#ff3a74;border:0;font:bold 12px Consolas;padding:0 16px}.keybar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:7px}.keybar button{padding:8px 2px}.keybar .wide{grid-column:span 2;color:#ffe45c}@media(max-width:650px){.terminal{font-size:8px;padding:7px 7px 155px}.bar .hint{display:none}.keybar{grid-template-columns:repeat(7,1fr)}}
</style></head><body>
<div class="bar"><b>ACTUAL C GAME</b><span class="hint">Same game rules as Windows.</span><button id="fullBtn">FULLSCREEN</button><button onclick="location.reload()">RESTART</button></div>
<pre id="terminal" class="terminal">Loading the C game…</pre>
<div class="input-dock"><div id="prompt" class="prompt">Loading…</div><div class="entry"><input id="entry" inputmode="text" autocomplete="off" autocapitalize="characters" aria-label="Game command"><button id="send">ENTER</button></div><div id="keybar" class="keybar"></div></div>
<script>
window.PimpTerminal={el:document.getElementById('terminal'),buffer:'',write(t){this.buffer+=t;this.buffer=this.buffer.replace(/\x1b\[2J\x1b\[H/g,'\f').split('\f').pop().replace(/\x1b\[[0-9;?]*[A-Za-z]/g,'');if(this.buffer.length>60000)this.buffer=this.buffer.slice(-60000);this.el.textContent=this.buffer;requestAnimationFrame(()=>scrollTo(0,document.body.scrollHeight))}};
const entry=document.getElementById('entry'),promptEl=document.getElementById('prompt');let resolver=null,mode='key';
function finish(value){if(!resolver)return;const done=resolver;resolver=null;entry.value='';promptEl.textContent='Processing…';done(value)}
window.PimpInput={readKey(){mode='key';promptEl.textContent='Enter a command';entry.inputMode='text';entry.focus();return new Promise(r=>resolver=r)},readNumber(label){mode='number';promptEl.textContent=label;entry.inputMode='numeric';entry.focus();return new Promise(r=>resolver=r)}};
function submit(){let v=entry.value.trim();if(mode==='number')finish(Number.parseInt(v,10)||0);else finish((v||'\n').charCodeAt(0))}document.getElementById('send').onclick=submit;entry.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}else if(e.key==='Escape'){e.preventDefault();finish(27)}});
const keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['ESC','ENTER']);document.getElementById('keybar').innerHTML=keys.map(k=>`<button class="${k.length>1?'wide':''}" data-key="${k}">${k}</button>`).join('');document.getElementById('keybar').onclick=e=>{const k=e.target.dataset.key;if(!k)return;if(k==='ESC')finish(27);else if(k==='ENTER')finish(10);else finish(k.charCodeAt(0))};
document.getElementById('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{document.body.classList.toggle('standalone');promptEl.textContent='Fullscreen is unavailable in this browser; rotate your phone for a larger view.'}};
</script><script src="pimpwyld.js"></script></body></html>
